name: Repository catalog
on:
  push:
    paths: ['repo/**', 'tests/test_repo_catalog.py', '.github/workflows/repo-catalog.yml']
  pull_request:
    paths: ['repo/**', 'tests/test_repo_catalog.py', '.github/workflows/repo-catalog.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_repo_catalog.py -v
