name: Repository catalog
on:
  push:
    paths: ['repo/**', 'paper/ai-infra/**', 'tests/test_repo_catalog.py', 'tests/test_ai_infra_release.py', 'tests/test_cv_dl_rl_crosslist.py', 'tests/test_autoswarm_ai_catalog.py', '.github/workflows/repo-catalog.yml']
  pull_request:
    paths: ['repo/**', 'paper/ai-infra/**', 'tests/test_repo_catalog.py', 'tests/test_ai_infra_release.py', 'tests/test_cv_dl_rl_crosslist.py', 'tests/test_autoswarm_ai_catalog.py', '.github/workflows/repo-catalog.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_repo_catalog.py -v
      - run: python -m unittest discover -s tests -p test_ai_infra_release.py -v
      - run: python -m unittest discover -s tests -p test_cv_dl_rl_crosslist.py -v
      - run: python repo/cv-dl-rl/build_catalog.py --check
      - run: python -m unittest discover -s tests -p test_autoswarm_ai_catalog.py -v
